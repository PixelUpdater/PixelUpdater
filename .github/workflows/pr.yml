name: PR Build

on:
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build (leave empty for current branch)'
        required: false
        type: string

jobs:
  build:
    name: Build Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # If PR number is provided, checkout the PR branch
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Get version
        id: get_version
        run: |
          # For PR builds or manual with PR number, use PR number + SHA
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pr_number="${{ github.event.pull_request.number }}"
            short_sha=$(git rev-parse --short HEAD)
            version="pr-${pr_number}-${short_sha}"
          elif [ "${{ inputs.pr_number }}" != "" ]; then
            pr_number="${{ inputs.pr_number }}"
            short_sha=$(git rev-parse --short HEAD)
            version="pr-${pr_number}-${short_sha}"
          else
            branch_name=$(git rev-parse --abbrev-ref HEAD | sed 's/[^a-zA-Z0-9]/-/g')
            short_sha=$(git rev-parse --short HEAD)
            version="manual-${branch_name}-${short_sha}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using version: $version"

      - name: Show what we're building
        run: |
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD || echo 'detached')"
          echo "Last commit: $(git log -1 --oneline)"

      - name: Validate gradle wrapper checksum
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "RELEASE_KEYSTORE=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSPHRASE=android" >> $GITHUB_ENV
          echo "RELEASE_KEYSTORE_PASSPHRASE=android" >> $GITHUB_ENV

      - name: Build PR
        run: |
          ./gradlew zipRelease

      - name: Debug list artifacts
        run: |
          ls -lR app/build/distributions/release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelUpdater-${{ steps.get_version.outputs.version }}
          path: app/build/distributions/release/*.zip
